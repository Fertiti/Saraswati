<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <mask id="daunt-hole">
            <!-- Белый фон маски (оставляет фигуру видимой) -->
            <rect width="100%" height="100%" fill="white" />
            <!-- Черный круг (вырезает идеальную дырку внутри буквы) -->
            <circle cx="256" cy="296" r="80" fill="black" />
        </mask>
    </defs>
    
    <!-- Сама буква d с примененным вырезом -->
    <g fill="#fafbf6" mask="url(#daunt-hole)">
        <!-- Внешний круг буквы -->
        <circle cx="256" cy="296" r="140" />
        <!-- Вертикальная палочка (хвост) -->
        <rect x="336" y="76" width="60" height="360" />
    </g>
</svg>
